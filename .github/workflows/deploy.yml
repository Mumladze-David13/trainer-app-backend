name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          # Собираем образ, пока старый контейнер работает, и только потом
          # пересоздаём его — если сборка упадёт, прод останется на прошлой версии
          script: |
            set -e
            cd /var/www/trainer-app/backend
            git pull origin main
            docker compose build
            docker compose up -d